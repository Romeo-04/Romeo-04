name: Brew the daily stats

on:
  schedule: # every day, 00:00 Asia/Manila
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/brew.yml"

concurrency:
  group: brew-output
  cancel-in-progress: false

jobs:
  brew:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Brew today's tab + house blend
        run: node scripts/brew-stats.mjs dist
        env:
          GH_USER: ${{ github.repository_owner }}
          # Public data only, so the default token works. A PAT secret, if added, is used instead.
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Grind the coffee snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/coffee-snake.svg?color_snake=#c4552f&color_dots=#f3e6d4,#e6c7a3,#c99467,#8b5a2c,#2b1a10
            dist/coffee-snake-dark.svg?palette=github-dark&color_snake=#f0a27f&color_dots=#21170f,#5a3420,#8b5a2c,#c4552f,#f0a27f

      - name: Serve to the brew-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: brew-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
